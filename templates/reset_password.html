<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Password Baru - INSPECURE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/inter/inter.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/phosphor/bold.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/phosphor/fill.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/theme_init.js') }}"></script>
</head>
<body>
    <div class="auth-top">
        <a href="{{ url_for('auth.landing') }}" class="logo"><span class="logo-mark"><i class="ph-fill ph-shield-check"></i></span><span>INSPECURE</span></a>
        <div class="right"><a href="{{ url_for('auth.login') }}" class="btn btn-text"><i class="ph-bold ph-arrow-left"></i> Kembali ke Masuk</a></div>
    </div>
    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-head">
                <div class="logo-mark"><i class="ph-bold ph-lock-key"></i></div>
                <h1>Buat Password Baru</h1>
                <p>Gunakan password minimal 8 karakter.</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}<div class="flash-wrapper">{% for category, message in messages %}<div class="alert {{ category }}"><i class="ph-fill {{ 'ph-check-circle' if category == 'success' else 'ph-warning-circle' }}"></i>{{ message }}</div>{% endfor %}</div>{% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <label for="password">Password baru</label>
                    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
                </div>
                <div class="input-group">
                    <label for="confirm_password">Ulangi password baru</label>
                    <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-login">Simpan Password Baru <i class="ph-bold ph-check"></i></button>
            </form>
        </div>
    </main>
</body>
</html>
